name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets with Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare named APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/translate.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: translate-apk
          path: release-assets/translate.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version tag
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag harus mengikuti format vMAJOR.MINOR.PATCH, misalnya v1.0.0."
            exit 1
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: translate-apk
          path: release-assets

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" release-assets/translate.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$VERSION_TAG" release-assets/translate.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Translate $VERSION_TAG" \
              --generate-notes
          fi